<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Be My Valentine?</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Pacifico&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div id="question-container">
        <h1 class="main-text">Priyapetta Vani UK, Do you love me? 💖</h1>
        <div class="gif-container">
          <img
            src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExODhiNzU1eTVuNW4wajR5dmRmODN5ZHR3aDlzMHZ5eW93aDlzMHZ5eSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif"
            alt="Cute bear asking question"
            class="cute-gif"
          />
        </div>
        <div class="buttons">
          <button id="yes-btn">Yes</button>
          <button id="no-btn">No</button>
        </div>
      </div>

      <div id="success-container" class="hidden">
        <h1 class="main-text">Yay! I love you! ❤️</h1>
        <div class="gif-container">
          <img src="ussss.jpeg" alt="Us together ❤️" class="couple-photo" />
        </div>
        <audio id="success-music" src="https://www.jiosaavn.com/song/neeyum-njanum/HyI0RToEVGY" loop></audio>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
